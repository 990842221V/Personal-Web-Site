<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation</title>
    <style>
        body, html {
            height: 200%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 200vh; /* Extend the container height to make scrolling possible */
        }

        .first, .second {
            position: fixed;
            width: 100%;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
        }

        .first {
            top: 0;
            background-color: #4CAF50;
            color: white;
            z-index: 1;
            transition: opacity 0.5s;
        }

        .second {
            top: 50vh;
            background-color: #2196F3;
            color: white;
            z-index: 2;
            transition: transform 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="first">
            <p>div 1</p>
        </div>
        <div class="second">
            <p>div 2</p>
        </div>
    </div>

    <script>
        window.addEventListener('scroll', () => {
            const firstDiv = document.querySelector('.first');
            const secondDiv = document.querySelector('.second');
            const scrollPosition = window.scrollY;
            const viewportHeight = window.innerHeight;
            const threshold = viewportHeight / 2;

            // Calculate the percentage of scroll relative to the threshold
            let scrollRatio = Math.min(scrollPosition / threshold, 1);

            // Apply the transformations and opacity based on the scroll ratio
            firstDiv.style.transform = `translateY(-${scrollRatio * 50}px)`;
            firstDiv.style.opacity = `${1 - scrollRatio}`;
            secondDiv.style.transform = `translateY(-${scrollRatio * 50}vh)`;
        });
    </script>
</body>
</html>
